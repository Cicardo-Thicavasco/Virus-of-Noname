                                        itemStyle: getNoteStyle(pathogen.note),
                                        pathogendata: pathogen
                                    });
                                }
                            } else if (pathogen.species) {
                                // 如果没有属，直接添加到科
                                familyNode.children.push({
                                    name: pathogen.species,
                                    value: 1,
                                    itemStyle: getNoteStyle(pathogen.note),
                                    pathogendata: pathogen
                                });
                            }
                        } else if (pathogen.genus) {
                            // 如果没有科，但有属
                            const genusKey = orderKey + '|' + pathogen.genus;
                            let genusNode = genusMap.get(genusKey);
                            if (!genusNode) {
                                genusNode = {
                                    name: pathogen.genus,
                                    children: []
                                };
                                genusMap.set(genusKey, genusNode);
                                orderNode.children.push(genusNode);
                            }
                            
                            // 添加种节点
                            if (pathogen.species) {
                                genusNode.children.push({
                                    name: pathogen.species,
                                    value: 1,
                                    itemStyle: getNoteStyle(pathogen.note),
                                    pathogendata: pathogen
                                });
                            }
                        } else if (pathogen.species) {
                            // 如果没有科和属，直接添加到目
                            orderNode.children.push({
                                name: pathogen.species,
                                value: 1,
                                itemStyle: getNoteStyle(pathogen.note),
                                pathogendata: pathogen
                            });
                        }
                    } else if (pathogen.family) {
                        // 如果没有门、纲和目，但有科
                        const familyKey = kingdomKey + '|' + pathogen.family;
                        let familyNode = familyMap.get(familyKey);
                        if (!familyNode) {
                            familyNode = {
                                name: pathogen.family,
                                children: []
                            };
                            familyMap.set(familyKey, familyNode);
                            kingdomNode.children.push(familyNode);
                        }
                        
                        // 处理属节点
                        if (pathogen.genus) {
                            const genusKey = familyKey + '|' + pathogen.genus;
                            let genusNode = genusMap.get(genusKey);
                            if (!genusNode) {
                                genusNode = {
                                    name: pathogen.genus,
                                    children: []
                                };
                                genusMap.set(genusKey, genusNode);
                                familyNode.children.push(genusNode);
                            }
                            
                            // 添加种节点
                            if (pathogen.species) {
                                genusNode.children.push({
                                    name: pathogen.species,
                                    value: 1,
                                    itemStyle: getNoteStyle(pathogen.note),
                                    pathogendata: pathogen
                                });
                            }
                        } else if (pathogen.species) {
                            // 如果没有属，直接添加到科
                            familyNode.children.push({
                                name: pathogen.species,
                                value: 1,
                                itemStyle: getNoteStyle(pathogen.note),
                                pathogendata: pathogen
                            });
                        }
                    } else if (pathogen.genus) {
                        // 如果没有门、纲、目和科，但有属
                        const genusKey = kingdomKey + '|' + pathogen.genus;
                        let genusNode = genusMap.get(genusKey);
                        if (!genusNode) {
                            genusNode = {
                                name: pathogen.genus,
                                children: []
                            };
                            genusMap.set(genusKey, genusNode);
                            kingdomNode.children.push(genusNode);
                        }
                        
                        // 添加种节点
                        if (pathogen.species) {
                            genusNode.children.push({
                                name: pathogen.species,
                                value: 1,
                                itemStyle: getNoteStyle(pathogen.note),
                                pathogendata: pathogen
                            });
                        }
                    } else if (pathogen.species) {
                        // 如果没有门、纲、目、科和属，直接添加到界
                        kingdomNode.children.push({
                            name: pathogen.species,
                            value: 1,
                            itemStyle: getNoteStyle(pathogen.note),
                            pathogendata: pathogen
                        });
                    }
                } else if (pathogen.species) {
                    // 如果没有界，直接添加到域
                    domainNode.children.push({
                        name: pathogen.species,
                        value: 1,
                        itemStyle: getNoteStyle(pathogen.note),
                        pathogendata: pathogen
                    });
                }
            });
            return root;
        }
        
        // 根据域获取样式
        function getDomainStyle(domain) {
            if (domain === "细菌域") return '#ffffbb';
            else if (domain.includes("病毒")) return '#bfe4ff';
            else if (domain === "真核域") return '#fbd3df';
            else return '#f5f5f5';
        }
        
        // 根据备注获取样式
        function getNoteStyle(note) {
            if (note === "虚构") return { color: '#e0e0e0' };
            else if (note === "阳性") return { color: 'blueviolet' };
            else if (note === "阴性") return { color: 'red' };
            else return { color: '#f5f5f5' };
        }

        // 使用构建的树状图数据
        const treeData = buildTreeData();
        
        // 配置选项
        const option = {
            tooltip: {
                trigger: 'item',
                triggerOn: 'mousemove',
                formatter: function (params) {
                    // 显示详细信息
                    if (params.data.pathogendata) {
                        const p = params.data.pathogendata;
                        return `
                            <div style="font-weight:bold;margin-bottom:5px;">${p.species}</div>
                            <div>域: ${p.domain}</div>
                            <div>界: ${p.kingdom || '无'}</div>
                            <div>门: ${p.phylum || '无'}</div>
                            <div>纲: ${p.class || '无'}</div>
                            <div>目: ${p.order || '无'}</div>
                            <div>科: ${p.family || '无'}</div>
                            <div>属: ${p.genus || '无'}</div>
                            <div>备注: ${p.note || '无'}</div>
                        `;
                    } else {
                        return `${params.name}<br/>子分类数: ${params.value || params.children.length}`;
                    }
                }
            },
            series: [{
                type: 'tree',
                data: [treeData],
                layout: 'orthogonal',
                orient: 'LR',
                label: {
                    position: 'left',
                    verticalAlign: 'middle',
                    align: 'right',
                    fontSize: 16,
                    fontFamily: '"STKaiti", "华文楷体", serif',
                    formatter: function(params) {
                        // 限制显示长度，防止文本过长
                        return params.name.length > 15 ? params.name.substring(0, 15) + '...' : params.name;
                    }
                },
                leaves: {
                    label: {
                        position: 'right',
                        verticalAlign: 'middle',
                        align: 'left',
                        fontSize: 12,
                        fontFamily: '"STKaiti", "华文楷体", serif'
                    }
                },
                expandAndCollapse: true,
                initialTreeDepth: 2, // 初始展开到第3层
                roam: true,
                lineStyle: {
                    color: '#ccc',
                    width: 1.5
                },
                emphasis: {
                    focus: 'descendant'
                },
                animationDuration: 750,
                animationDurationUpdate: 1000
            }]
        };

        // 使用配置项设置图表
        option && myChart.setOption(option);

        // 响应式布局：适应窗口大小变化
        window.addEventListener('resize', function() {
            myChart.resize();
        });
        
        // 添加点击事件，点击节点时跳转到对应病原体
        myChart.on('click', function(params) {
            if (params.data.pathogendata) {
                const id = params.data.pathogendata.id;
                if (linkMap.hasOwnProperty(id)) {
                    window.open(linkMap[id], '_blank');
                }
            }
        });
        
        // 控制按钮功能
         document.getElementById('expandAll').addEventListener('click', function() {
            myChart.setOption({
                series: [{
                    initialTreeDepth: 114514 // 设置足够大的深度以展开所有节点
                }]
            });
        });
        
        document.getElementById('collapseAll').addEventListener('click', function() {
            myChart.setOption({
                series: [{
                    initialTreeDepth: 1 // 只显示根节点
                }]
            });
        });
        
        document.getElementById('resetView').addEventListener('click', function() {
            myChart.setOption({
                series: [{
                    initialTreeDepth: 2 // 重置到初始深度
                }]
            });
        });
    </script>
</body>
</html>
